name: Apply bounty patch 52037

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 20

      - name: Apply and push bounty patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NUGMUNCHERS"
          git config user.email "NUGMUNCHERS@users.noreply.github.com"

          git fetch --no-tags --depth=20 origin main
          git fetch --no-tags --depth=1 origin automation/payload-52037
          : > /tmp/patch.b64
          for part in 00 01 02 03 04; do
            git show FETCH_HEAD:.github/patches/52037/part${part}.b64 >> /tmp/patch.b64
          done

          test "$(wc -c < /tmp/patch.b64)" = "10556"
          printf '%s  %s\n' d184da782209a912650e6ace1fbae1d216780ab8a592300359b28c3fe33a109e /tmp/patch.b64 | sha256sum -c -
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/patch.mbox
          printf '%s  %s\n' 776181408c1d703c8dca86603b246dceebbb34460d157d6313c15547a03435a2 /tmp/patch.mbox | sha256sum -c -

          git checkout -B ai-bounty/issue-52037 c2acbbbca5f63164e64c7bc2f0278bb061b329ca
          git am /tmp/patch.mbox
          test "$(git rev-parse HEAD^{tree})" = "0dbcb7139afc9eb8d09f8bc0688dfb08d56ef6e5"
          git push --force origin HEAD:ai-bounty/issue-52037
